name: Generate Snake

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate Snake SVG (Purple Theme)
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: im-meghana
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-dark&color_snake=%239b5cff&color_dots=%231a0033,%233b0066,%235e17eb,%237a2cff,%23a855f7
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%239b5cff&color_dots=%231a0033,%233b0066,%235e17eb,%237a2cff,%23a855f7

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
